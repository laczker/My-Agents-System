# Docker pilot (personal/devbot/CLAUDE.md) — skupina denních botů (assistant,
# zpravodaj, mailista, joby, nakup, trener) v jednom kontejneru. Kontejner hlídá
# watchdog.sh (compose ps + exec pgrep, viz docs/META_BOT.md §4a). Všech 6 profilů běží
# v kontejneru (iterace 6-8 a 10); start-daily.sh čte seznam z daily-profiles.txt
# (mount), DAILY_PROFILES se tady nenastavuje. Pozor: kvůli `pid: host` vidí pgrep ve
# watchdogu i hostové procesy, takže hostový proces stejného profilu musí být
# před cutoverem zastavený.
# Pinned project name + container name: without `name:` the project name is the
# directory name, and both compose files shared it (`agent-system`), so `up` of one
# file reported the other's container as an orphan (`--remove-orphans` would delete
# it). container_name keeps the historical name `agent-system-daily-bots-1`, so nothing
# that refers to it by name changes.
name: agent-system-daily

services:
  daily-bots:
    container_name: agent-system-daily-bots-1
    build:
      context: .
      dockerfile: Dockerfile.daily
    # Musí sedět s hostitelským uživatelem (agent, uid/gid 1000) — jinak soubory,
    # co bridge-ts zapíše do bind-mountnutých personal/<profil> adresářů (heartbeat,
    # session, fronta...), skončí na hostu vlastněné rootem a host uživatel k nim
    # ztratí přístup (zjištěno code review, iterace 1). Container `claude` CLI hledá
    # auth podle $HOME, proto musí sedět i s cestou mountů níž.
    # Sdílený registr session pro ListAgents/SendMessage mezi hostem a kontejnery
    # (iterace 9). `pid: host` je nutné, aby si procesy ověřily `pidDomain` v
    # záznamu session; adresářové rw mounty (ne jednotlivé soubory — inode problém).
    pid: host
    user: "1000:1000"
    environment:
      - HOME=/home/agent
    volumes:
      - ./.env:/home/agent/agent-system/.env:ro
      - ./.env.zpravodaj:/home/agent/agent-system/.env.zpravodaj:ro
      - ./.env.mailista:/home/agent/agent-system/.env.mailista:ro
      - ./.env.joby:/home/agent/agent-system/.env.joby:ro
      - ./.env.nakup:/home/agent/agent-system/.env.nakup:ro
      - ./.env.trener:/home/agent/agent-system/.env.trener:ro
      - ./personal/assistant:/home/agent/agent-system/personal/assistant
      - ./personal/zpravodaj:/home/agent/agent-system/personal/zpravodaj
      - ./personal/mailista:/home/agent/agent-system/personal/mailista
      - ./personal/joby:/home/agent/agent-system/personal/joby
      - ./personal/nakup:/home/agent/agent-system/personal/nakup
      - ./personal/trener:/home/agent/agent-system/personal/trener
      # Profile list shared with watchdog.sh and the dashboard (read by start-daily.sh).
      - ./daily-profiles.txt:/daily-profiles.txt:ro
      # docs/ (META_BOT.md, ARCHITEKTURA.md) as a read-WRITE DIRECTORY mount: the assistant
      # must update them (personal/assistant/CLAUDE.md). A single-file mount broke on
      # tmp+rename writes (new inode invisible to the mount); a directory mount does not.
      - ./docs:/home/agent/agent-system/docs
      # Whole ~/.claude as a READ-ONLY directory mount: a single-file mount of
      # .credentials.json kept the stale expired file after a token refresh on the
      # host (tmp+rename = new inode) -> 401 in the container. The directory always
      # shows the current file. Read-only so containers never refresh/rotate the
      # token themselves (race with host) and cannot alter host settings/hooks.
      # The sessions/ registry is a nested rw mount on top. Hardcoded path, not ${HOME}.
      - /home/agent/.claude:/home/agent/.claude:ro
      - /home/agent/.claude/sessions:/home/agent/.claude/sessions
      - /home/agent/.claude.json:/home/agent/.claude.json:ro
      - /tmp/cc-socks:/tmp/cc-socks
    # Measured with `docker stats --no-stream` (2026-10-07): ~745 MiB for all 6 bridge-ts
    # profiles + their claude subprocesses. 1.5 GiB = ~2x headroom, and caps a runaway
    # profile at under half of the ~3.7 GiB host so it cannot OOM-kill the other containers
    # or the host-side bots (devbot, dashboard). Hitting the cap OOM-kills a process inside
    # the container; watchdog.sh notices the missing bridge-ts and force-recreates.
    mem_limit: 1536m
    # No restart policy on purpose: watchdog.sh (cron, every minute) is the single
    # restarter; a docker-level policy would race with its force-recreate.
    restart: "no"
