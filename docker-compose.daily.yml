# Docker pilot (personal/devbot/CLAUDE.md) — skupina denních botů (assistant,
# zpravodaj, mailista, joby, nakup, trener) v jednom kontejneru. Kontejner hlídá
# watchdog.sh (compose ps + exec pgrep, viz META_BOT.md §4a). Všech 6 profilů běží
# v kontejneru (iterace 6-8 a 10); start-daily.sh defaultuje na všech 6, takže
# DAILY_PROFILES se tady nenastavuje. Pozor: kvůli `pid: host` vidí pgrep ve
# watchdogu i hostové procesy, takže hostový proces stejného profilu musí být
# před cutoverem zastavený.
services:
  daily-bots:
    build:
      context: .
      dockerfile: Dockerfile.daily
    # Musí sedět s hostitelským uživatelem (agent, uid/gid 1000) — jinak soubory,
    # co bridge-ts zapíše do bind-mountnutých personal/<profil> adresářů (heartbeat,
    # session, fronta...), skončí na hostu vlastněné rootem a host uživatel k nim
    # ztratí přístup (zjištěno code review, iterace 1). Container `claude` CLI hledá
    # auth podle $HOME, proto musí sedět i s cestou mountů níž.
    # Sdílený registr session pro ListAgents/SendMessage mezi hostem a kontejnery
    # (iterace 9). `pid: host` je nutné, aby si procesy ověřily `pidDomain` v
    # záznamu session; adresářové rw mounty (ne jednotlivé soubory — inode problém).
    pid: host
    user: "1000:1000"
    environment:
      - HOME=/home/agent
    volumes:
      - ./.env:/home/agent/agent-system/.env:ro
      - ./.env.zpravodaj:/home/agent/agent-system/.env.zpravodaj:ro
      - ./.env.mailista:/home/agent/agent-system/.env.mailista:ro
      - ./.env.joby:/home/agent/agent-system/.env.joby:ro
      - ./.env.nakup:/home/agent/agent-system/.env.nakup:ro
      - ./.env.trener:/home/agent/agent-system/.env.trener:ro
      - ./personal/assistant:/home/agent/agent-system/personal/assistant
      - ./personal/zpravodaj:/home/agent/agent-system/personal/zpravodaj
      - ./personal/mailista:/home/agent/agent-system/personal/mailista
      - ./personal/joby:/home/agent/agent-system/personal/joby
      - ./personal/nakup:/home/agent/agent-system/personal/nakup
      - ./personal/trener:/home/agent/agent-system/personal/trener
      # Read-only — code review iterace 3 ukázal, že rw mount jednotlivého souboru
      # nefunguje spolehlivě (Linux bind mount je vázaný na inode, ne na cestu;
      # `Edit` nástroj píše přes tmp+rename, takže zápis skončí na novém inode,
      # co bind mount vůbec nevidí). Skutečné rw řešení (adresářový mount) je
      # samostatná budoucí položka, viz TASKS.md.
      - ./META_BOT.md:/home/agent/agent-system/META_BOT.md:ro
      - ./ARCHITEKTURA.md:/home/agent/agent-system/ARCHITEKTURA.md:ro
      # Sdílený token s hostem, read-only — pokud by CLI v kontejneru potřebovalo
      # refresh zapsat, selže (přijatelné pro jednorázový test iterace 2, viz spec).
      # Cesta natvrdo (ne ${HOME}) — ta by se při spuštění mimo interaktivní shell
      # (budoucí watchdog/cron) mohla vyhodnotit prázdná a mount by tiše zmizel
      # nebo vytvořil prázdný adresář (zjištěno code review).
      - /home/agent/.claude/.credentials.json:/home/agent/.claude/.credentials.json:ro
      - /home/agent/.claude.json:/home/agent/.claude.json:ro
      - /home/agent/.claude/sessions:/home/agent/.claude/sessions
      - /tmp/cc-socks:/tmp/cc-socks
    restart: "no"
