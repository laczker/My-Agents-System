# Docker pilot, iterace 5 (personal/devbot/CLAUDE.md) — skupina projektových
# botů (zatím jen fbalbums) v samostatném kontejneru vedle denní skupiny a
# vedle toho, co běží na hostu. Záměrně BEZ napojení na watchdog.sh/crontab a
# bez `restart` policy — stejně jako docker-compose.daily.yml tahle iterace
# jen ověřuje mechaniku (build, start, čitelnost stavu přes mount, claude CLI
# auth, git worktree repo mount), migraci živého provozu řeší budoucí iterace.
# Pinned project name + container name: without `name:` the project name is the
# directory name, and both compose files shared it (`agent-system`), so `up` of one
# file reported the other's container as an orphan (`--remove-orphans` would delete
# it). container_name keeps the historical name `agent-system-project-bots-1`, so nothing
# that refers to it by name changes.
name: agent-system-project

services:
  project-bots:
    container_name: agent-system-project-bots-1
    build:
      context: .
      dockerfile: Dockerfile.project
    # Stejný důvod jako docker-compose.daily.yml: musí sedět s hostitelským
    # uživatelem (agent, uid/gid 1000), jinak soubory zapsané do bind-mountů
    # (heartbeat, session, fronta, i vlastní commit uvnitř produktového repa)
    # skončí na hostu vlastněné rootem.
    # Sdílený registr session pro ListAgents/SendMessage mezi hostem a kontejnery
    # (iterace 9). `pid: host` je nutné, aby si procesy ověřily `pidDomain` v
    # záznamu session; adresářové rw mounty (ne jednotlivé soubory — inode problém).
    pid: host
    user: "1000:1000"
    environment:
      - HOME=/home/agent
    volumes:
      - ./.env.fbalbums:/home/agent/agent-system/.env.fbalbums:ro
      - ./personal/fbalbums:/home/agent/agent-system/personal/fbalbums
      # Read-write, na rozdíl od denní skupiny — fbalbums si sem otevírá
      # `git worktree` (EnterWorktree/ExitWorktree) pro vlastní vývojový
      # cyklus, read-only by mu ten krok shodilo hned na startu.
      - /home/agent/fbalbums:/home/agent/fbalbums
      # Read-only, stejný důvod jako docker-compose.daily.yml (bind mount
      # vázaný na inode, ne na cestu — rw mount jednotlivého souboru
      # nefunguje spolehlivě). Adresářový mount fix je sdílená budoucí
      # položka pro obě skupiny, viz TASKS.md.
      - ./META_BOT.md:/home/agent/agent-system/META_BOT.md:ro
      - ./ARCHITEKTURA.md:/home/agent/agent-system/ARCHITEKTURA.md:ro
      # Whole ~/.claude as a READ-ONLY directory mount: a single-file mount of
      # .credentials.json kept the stale expired file after a token refresh on the
      # host (tmp+rename = new inode) -> 401 in the container. The directory always
      # shows the current file. Read-only so containers never refresh/rotate the
      # token themselves (race with host) and cannot alter host settings/hooks.
      # The sessions/ registry is a nested rw mount on top. Hardcoded path, not ${HOME}.
      - /home/agent/.claude:/home/agent/.claude:ro
      - /home/agent/.claude/sessions:/home/agent/.claude/sessions
      - /home/agent/.claude.json:/home/agent/.claude.json:ro
      - /tmp/cc-socks:/tmp/cc-socks
    # Measured with `docker stats --no-stream` (2026-10-07): ~200 MiB (fbalbums only, idle-ish).
    # 512 MiB = ~2.5x headroom for a claude subprocess running git/worktree work, while
    # keeping the sum of both limits (2 GiB) well below the ~3.7 GiB host.
    mem_limit: 512m
    # No restart policy on purpose: watchdog.sh (cron, every minute) is the single
    # restarter; a docker-level policy would race with its force-recreate.
    restart: "no"
